name: Weekly Tourism Investment Newsletter

on:
  schedule:
    # Every Sunday at 07:00 UTC (10:00 AM Saudi Arabia)
    - cron: '0 7 * * 0'
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly newsletter
        env:
          NEWSLETTER_API: ${{ secrets.NEWSLETTER_API }}
          NEWSLETTER_ADMIN_TOKEN: ${{ secrets.NEWSLETTER_ADMIN_TOKEN }}
        run: |
          curl -f -X POST "$NEWSLETTER_API/api/newsletter/send-weekly" \
            -H "X-Newsletter-Admin-Token: $NEWSLETTER_ADMIN_TOKEN"
